# Formatting + lint for every PR — CHECK-ONLY: CI never rewrites code.
# Developers fix locally with `npm run format` / `npx eslint . --fix`.
#
# Required status check: "Code Style Gate" (only the gate — the style job is
# path-filtered and may legitimately be skipped).

name: code style

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: code-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On workflow_dispatch there is no PR diff — the step is skipped and the
      # `|| 'true'` fallback above forces every domain on.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            site:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - '**/*.md'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.ts'
              - 'postcss.config.mjs'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.github/workflows/code-style.yml'
              - '.github/actions/setup/**'

  style:
    name: eslint + prettier check
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: eslint
        run: npx eslint .

      - name: prettier --check
        run: npx prettier --check .

  gate:
    name: Code Style Gate
    needs: [changes, style]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All good
        run: echo "All jobs succeeded or were skipped as not relevant."
