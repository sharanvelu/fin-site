# Test suite for every PR.
#
# Required status check: "Tests Gate" (make ONLY the gate required — the work
# job is path-filtered and may legitimately be skipped, which would wedge a
# PR if it were required directly).
#
# Layout ("changes → work → gate"):
#   changes  detects whether site code or tests changed (forced true on dispatch)
#   tests    Vitest unit suite (jsdom + React Testing Library): content/plug
#            data integrity and component behavior
#   gate     always runs; fails iff a needed job failed or was cancelled

name: tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On workflow_dispatch there is no PR diff — the step is skipped and the
      # `|| 'true'` fallback above forces every domain on.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            site:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.ts'
              - 'vitest.config.mts'
              - '.github/workflows/tests.yml'
              - '.github/actions/setup/**'

  tests:
    name: vitest
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run tests
        run: npm test

  gate:
    name: Tests Gate
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All good
        run: echo "All jobs succeeded or were skipped as not relevant."
